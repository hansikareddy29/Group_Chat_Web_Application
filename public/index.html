<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h1>Group Chat</h1>

        <p class="subtitle">
            Real-time WebSocket Chat Application
        </p>


        <!-- ============================= -->
        <!-- HOME -->
        <!-- ============================= -->

        <div
            id="homeScreen"
            class="card"
        >

            <h2>Create Room</h2>

            <input
                type="text"
                id="createUsername"
                placeholder="Enter username"
                maxlength="20"
            >

            <input
                type="number"
                id="capacity"
                placeholder="Room capacity"
                min="2"
                max="100"
            >

            <select id="duration">

                <option value="none">
                    No duration
                </option>

                <option value="1">
                    1 minute
                </option>

                <option value="5">
                    5 minutes
                </option>

                <option value="10">
                    10 minutes
                </option>

                <option value="30">
                    30 minutes
                </option>

                <option value="60">
                    60 minutes
                </option>

                <option value="120">
                    120 minutes
                </option>

            </select>

            <button id="createButton">
                Create Room
            </button>


            <hr>


            <h2>Join Room</h2>

            <input
                type="text"
                id="joinUsername"
                placeholder="Enter username"
                maxlength="20"
            >

            <input
                type="text"
                id="roomCodeInput"
                placeholder="Room code"
                maxlength="6"
            >

            <button id="joinButton">
                Join Room
            </button>


            <p
                id="errorMessage"
                class="error"
            ></p>

        </div>


        <!-- ============================= -->
        <!-- CHAT -->
        <!-- ============================= -->

        <div
            id="chatScreen"
            class="chat-card hidden"
        >

           <div class="chat-header">

    <div>

        <h2>
            Room
            <span id="roomCode"></span>
        </h2>

        <p id="currentUsername">
            You: -
        </p>

        <div
            id="participantsSection"
            class="participants-section"
        >

            <div class="participants-header">

                <strong>
                    👥 Participants
                </strong>

                <span id="participantCount">
                    0 / 0
                </span>

            </div>

<div
    id="participantsSection"
    class="participants-section"
>

    <button
        id="participantsToggle"
        class="participants-toggle"
        type="button"
    >
        <span>
            👥 Participants
        </span>

        <span id="participantCount">
            0 / 0
        </span>

        <span id="participantsArrow">
            ▼
        </span>
    </button>


    <div
        id="participantsList"
        class="participants-list hidden"
    ></div>

</div>

        </div>


        <p id="connectionStatus">
            Connected
        </p>

    </div>


    <div class="room-info">

        <button
            id="copyCodeButton"
            class="copy-button"
        >
            Copy Code
        </button>

        <button
            id="leaveButton"
            class="leave-button"
        >
            Leave
        </button>

        <div
            id="timer"
            class="timer"
        >
            No duration
        </div>

    </div>

</div>


            <div
                id="messages"
                class="messages"
            ></div>


            <!-- TYPING INDICATOR -->

            <div
                id="typingIndicator"
                class="typing-indicator"
            ></div>


            <!-- MESSAGE INPUT -->

            <div class="message-input-area">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    maxlength="1000"
                    autocomplete="off"
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- MESSAGE INFO MODAL -->
    <!-- ============================= -->

    <div
        id="messageInfoModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <h2>Message Info</h2>

            <p id="infoMessage"></p>

            <div id="infoUsers"></div>

            <button id="closeInfoButton">
                Close
            </button>

        </div>

    </div>


    <script src="/socket.io/socket.io.js"></script>

    <script src="app.js"></script>

</body>

</html>
